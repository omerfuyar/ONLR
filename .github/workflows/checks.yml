# Checks every change to dev and main: the Lua annotations of every Lua file, and the samples' tests.
# The samples are the tests (DESIGN.md, section 16): a sample's test of the engine runs it in LÖVE with SDL's offscreen driver,
# and its test of the editor is an OpenECS test, which a Debug build of OpenECS runs.
name: Checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

# a new push to a branch or a pull request cancels its older run, whose result no longer counts
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # OpenECS, built in Debug from its dev and laid out as a release has it: the editor's tests run in it, and the Lua check reads its definitions
  openecs:
    name: OpenECS
    runs-on: ubuntu-24.04
    steps:
      - name: Name OpenECS's commit
        id: commit
        run: echo "sha=$(git ls-remote https://github.com/omerfuyar/OpenECS refs/heads/dev | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore OpenECS
        id: cache
        uses: actions/cache@v4
        with:
          path: OpenECS
          key: openecs-debug-linux-${{ steps.commit.outputs.sha }}

      - uses: actions/checkout@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          repository: omerfuyar/OpenECS
          ref: ${{ steps.commit.outputs.sha }}
          submodules: recursive
          path: source

      - name: Build OpenECS
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: source
        run: |
          .github/scripts/install-linux.sh
          gcc shuild.c -o shuild.ignore -O3 -Wno-format-truncation
          ./shuild.ignore -b debug > build.log 2>&1 || true
          test -x build/Debug/bin/OpenECS || (tail -n 40 build.log && exit 1)

      # the program writes include/ as a release has it: the plugin interface and the standard plugins' definitions
      - name: Lay out OpenECS as a release
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir OpenECS
          cp -r source/build/Debug/bin/. OpenECS/
          OpenECS/OpenECS --definitions OpenECS/include > definitions.log 2>&1 || (cat definitions.log && exit 1)

      # a tar keeps the files' permissions, which an artifact does not
      - name: Pack OpenECS
        run: tar -czf openecs.tar.gz OpenECS

      - uses: actions/upload-artifact@v4
        with:
          name: openecs
          path: openecs.tar.gz
          retention-days: 1

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    needs: openecs
    steps:
      # shuild, which runs the tests, is a submodule
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: openecs

      # OpenECS needs the libraries that its build's packages bring, such as those of SDL
      - name: Unpack OpenECS
        run: |
          tar -xzf openecs.tar.gz
          git clone -q --depth 1 https://github.com/omerfuyar/OpenECS "$RUNNER_TEMP/openecs-source"
          "$RUNNER_TEMP/openecs-source/.github/scripts/install-linux.sh"

      # EGL, with Mesa drawing in software, lets LÖVE draw with SDL's offscreen driver on a runner without a graphics card
      - name: Install EGL
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri

      # LÖVE's AppImage, unpacked, as ONLR's archive holds it (DESIGN.md, section 15.2)
      - name: Install LÖVE
        run: |
          curl -sSL -o "$RUNNER_TEMP/love.AppImage" https://github.com/love2d/love/releases/download/11.5/love-11.5-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/love.AppImage"
          (cd "$RUNNER_TEMP" && ./love.AppImage --appimage-extract > /dev/null)
          echo "LOVE=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Run the samples' tests
        run: .github/scripts/test.sh

  lua:
    name: Lua (LuaLS)
    runs-on: ubuntu-24.04
    needs: openecs
    env:
      LUALS_VERSION: 3.15.0
      LOVE2D_DEFINITIONS: c630dd883cda128a19d850bd5e3911110b271609
    steps:
      - uses: actions/checkout@v4

      # the definitions of the ecs module and of the standard plugins, which .luarc.json names for the editor's plugins
      - uses: actions/download-artifact@v4
        with:
          name: openecs

      - name: Unpack OpenECS
        run: tar -xzf openecs.tar.gz

      - name: Install the Lua language server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -sSL "https://github.com/LuaLS/lua-language-server/releases/download/$LUALS_VERSION/lua-language-server-$LUALS_VERSION-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP/luals"

      # LÖVE's definitions, from LuaCATS, which .luarc.json names: the check finds code that misuses LÖVE
      - name: Get LÖVE's definitions
        run: |
          git clone -q https://github.com/LuaCATS/love2d build/love2d
          git -C build/love2d checkout -q "$LOVE2D_DEFINITIONS"

      - name: Check the Lua files
        run: |
          "$RUNNER_TEMP/luals/bin/lua-language-server" --check="$GITHUB_WORKSPACE" --checklevel=Warning --logpath="$RUNNER_TEMP/luals-log" | tee luals.log
          grep -q "no problems found" luals.log
